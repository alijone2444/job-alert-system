name: Job Alert Cron (manual / backup)

# PRIMARY SCHEDULE LIVES ELSEWHERE.
#
# cron-job.org calls the Vercel function every 2 minutes:
#   https://job-alert-system-two.vercel.app/api/run?key=<RUN_SECRET>
# That is faster than GitHub can schedule (~5 min floor, and it throttles under
# load) and runs closer to Firestore, so it is the real production trigger.
#
# The `schedule:` trigger here is intentionally DISABLED, for two reasons:
#
#  1. It is redundant — it would duplicate work the Vercel cron already does.
#  2. COST ON A PRIVATE REPO. Public repos get unlimited Actions minutes;
#     private repos get 2,000/month free. At every 5 minutes this workflow is
#     ~8,600 runs/month x ~1.5-2 min, i.e. ~15,000 minutes — the free quota is
#     gone in about four days and runs start failing.
#
# Keep it as a manual escape hatch: use "Run workflow" in the Actions tab to
# force a cycle when Vercel is down or while debugging.
#
# To re-enable automatic runs (only if the Vercel cron is retired), uncomment
# the schedule block below — and check your Actions minutes first.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/5 * * * *'

concurrency:
  group: job-alert-cron
  cancel-in-progress: false

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # No Playwright/Chromium needed — every source is plain fetch + cheerio.

      - name: Run job alert engine
        working-directory: backend
        # Only the Firebase key is a secret. Everything else is either a code
        # default or a Firestore setting (settings/ingest, settings/scoring).
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm start
